<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // to do:
        // - add space to play file
        document.addEventListener("DOMContentLoaded", async ()=>{
            let transcriptions = await(await fetch("/uploads.json")).json();
            // from mdn
            // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort#sorting_array_of_objects
            transcriptions.forEach(async element => {
                let data = await(await fetch(`/uploads/${element}/data.json`)).json();
                let item = document.createElement("transcribed-item");
                let header = document.createElement("transcribed-header");
                let row = document.createElement("same-row");
                let transcription = document.createElement("transcribed-text");
                let summary = document.createElement("transcribed-text");
                let audio = document.createElement("audio");
                audio.src = `/uploads/${element}/audio.ogg`;
                audio.controls = true;
                header.innerText = `${(new Date(data.date)).toLocaleString()}`;
                transcription.innerText = data.transcription;
                summary.innerText = data.summary;
                row.appendChild(transcription);
                row.appendChild(summary);
                item.appendChild(header);
                item.appendChild(audio);
                item.appendChild(row);
                document.body.appendChild(item);
            });
        })
    </script>
</head>
<body>
    <h1>Transcriptions</h1>
    <a href="/upload.html">Upload audio here</a>
</body>
</html>
